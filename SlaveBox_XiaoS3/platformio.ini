; PlatformIO Project Configuration File
; SlaveBox_XiaoS3 — Seeed Studio XIAO ESP32S3
;
; Environments:
;   debug      → Verbose output, fast sensor loop (current dev behaviour)
;   production → Power-save mode: light sleep, 5-minute read interval
;
; https://docs.platformio.org/page/projectconf.html

; ── Shared library list ──────────────────────────────────────────────────────
[common_libs]
lib_deps =
    adafruit/Adafruit BME280 Library@^2.3.0
    adafruit/Adafruit SGP30 Sensor@^2.0.3
    claws/BH1750@^1.3.0
    bblanchon/ArduinoJson@^7.2.1
    adafruit/Adafruit GFX Library@^1.12.4
    adafruit/Adafruit SSD1306@^2.5.16

; ── Debug (default) ───────────────────────────────────────────────────────────
; Fast sensing loop, full serial output, OLED always active.
; Build: pio run -e debug   Upload: pio run -e debug -t upload
[env:debug]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
    -DDEBUG_MODE=1
lib_deps = ${common_libs.lib_deps}

; ── Production (power-save) ───────────────────────────────────────────────────
; Light sleep between reads. Sensor interval: 5 minutes.
; OLED off. Minimal serial output.
; Build: pio run -e production   Upload: pio run -e production -t upload
[env:production]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
    -DDEBUG_MODE=0
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_ESP32_DISABLE_BASIC_ROM_CONSOLE=y
lib_deps = ${common_libs.lib_deps}
